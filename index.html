<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Auction Platform - Stitch Screens Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4338ca;
      --primary-hover: #3730a3;
      --surface: #f8f9ff;
      --surface-card: #ffffff;
      --text-main: #0b1c30;
      --text-muted: #565e74;
      --border: #e2e8f0;
      --tag-bg: #eff4ff;
      --tag-text: #3730a3;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--surface);
      color: var(--text-main);
      padding: 32px 24px;
      line-height: 1.5;
    }
    header {
      max-width: 1400px;
      margin: 0 auto 32px auto;
      background: var(--surface-card);
      padding: 32px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px -2px rgba(11, 28, 48, 0.05);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 9999px;
      background: var(--tag-bg);
      color: var(--tag-text);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 16px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 12px 16px;
      border-radius: 8px;
    }
    .meta-bar span strong {
      color: var(--text-main);
    }

    .gallery-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 28px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -4px rgba(11, 28, 48, 0.1);
    }

    .preview-container {
      position: relative;
      width: 100%;
      height: 240px;
      background: #e2e8f0;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .preview-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      transition: transform 0.3s ease;
    }
    .card:hover .preview-container img {
      transform: scale(1.02);
    }

    .card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-number {
      font-size: 12px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .screen-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
      word-break: break-all;
    }
    .screen-specs {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .spec-pill {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      text-align: center;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">Google Stitch Export</div>
    <h1>Campus Auction Platform</h1>
    <p class="subtitle">Complete collection of 15 screens with high-resolution screenshot captures and standalone interactive HTML/Tailwind templates.</p>
    <div class="meta-bar">
      <span><strong>Project ID:</strong> 15375059538578470502</span>
      <span>•</span>
      <span><strong>Total Screens:</strong> 15</span>
      <span>•</span>
      <span><strong>Theme:</strong> Light / Plus Jakarta Sans</span>
      <span>•</span>
      <span><strong>Accent Color:</strong> #4338ca</span>
    </div>
  </header>

  <div class="gallery-grid" id="grid"></div>

  <script>
    fetch('screens/manifest.json')
      .then(res => res.json())
      .then(screens => {
        const grid = document.getElementById('grid');
        screens.forEach(s => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="preview-container">
              <a href="${s.imageFile}" target="_blank">
                <img src="${s.imageFile}" alt="${s.title}" loading="lazy">
              </a>
            </div>
            <div class="card-body">
              <div class="card-number">SCREEN ${String(s.index).padStart(2, '0')}</div>
              <h2 class="card-title">${s.title}</h2>
              <div class="screen-id">ID: ${s.id}</div>
              <div class="screen-specs">
                <span class="spec-pill">${s.dimensions}</span>
                <span class="spec-pill">${s.htmlSizeKb} KB HTML</span>
                <span class="spec-pill">${(parseFloat(s.imageSizeKb)/1024).toFixed(2)} MB PNG</span>
              </div>
              <div class="card-actions">
                <a href="${s.htmlFile}" target="_blank" class="btn btn-primary">Preview Code</a>
                <a href="${s.imageFile}" target="_blank" class="btn btn-outline">View Image</a>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Failed to load screens manifest:', err);
      });
  </script>
</body>
</html>
